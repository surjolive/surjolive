<svg width="1000" height="120" viewBox="0 0 1000 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="youtubeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC0000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="instagramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E4405F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FD1D1D;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="discordBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5865F2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4752C4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tikTokBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25F4EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FE2C55;stop-opacity:1" />
    </linearGradient>
    <filter id="badgeShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Title -->
  <text x="500" y="25" font-size="18" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="2">
    🌟 FOLLOW & CONNECT WITH SURJO LIVE 🌟
  </text>
  
  <!-- YouTube Badge -->
  <g filter="url(#badgeShadow)">
    <rect x="20" y="45" width="160" height="60" rx="8" fill="url(#youtubeBg)"/>
    <path d="M 60 65 L 60 80 L 70 72.5 Z" fill="white" opacity="0.95"/>
    <text x="100" y="75" font-size="16" font-weight="bold" fill="white" font-family="Arial, sans-serif" text-anchor="middle">
      YouTube
    </text>
    <text x="100" y="95" font-size="12" fill="white" font-family="Arial, sans-serif" text-anchor="middle" opacity="0.8">
      issurjolive
    </text>
  </g>
  
  <!-- Instagram Badge -->
  <g filter="url(#badgeShadow)">
    <rect x="200" y="45" width="160" height="60" rx="8" fill="url(#instagramBg)"/>
    <rect x="235" y="60" width="18" height="18" rx="3" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="244" cy="69" r="5" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="253" cy="58" r="1.5" fill="white"/>
    <text x="310" y="75" font-size="16" font-weight="bold" fill="white" font-family="Arial, sans-serif" text-anchor="middle">
      Instagram
    </text>
    <text x="310" y="95" font-size="12" fill="white" font-family="Arial, sans-serif" text-anchor="middle" opacity="0.8">
      surjoislive_
    </text>
  </g>
  
  <!-- Discord Badge -->
  <g filter="url(#badgeShadow)">
    <rect x="380" y="45" width="160" height="60" rx="8" fill="url(#discordBg)"/>
    <text x="440" y="70" font-size="20" text-anchor="middle">💬</text>
    <text x="460" y="75" font-size="16" font-weight="bold" fill="white" font-family="Arial, sans-serif">
      Discord
    </text>
    <text x="460" y="95" font-size="12" fill="white" font-family="Arial, sans-serif" opacity="0.8">
      Community
    </text>
  </g>
  
  <!-- TikTok Badge -->
  <g filter="url(#badgeShadow)">
    <rect x="560" y="45" width="160" height="60" rx="8" fill="url(#tikTokBg)"/>
    <text x="620" y="70" font-size="20" text-anchor="middle">🎵</text>
    <text x="640" y="75" font-size="16" font-weight="bold" fill="white" font-family="Arial, sans-serif">
      TikTok
    </text>
    <text x="640" y="95" font-size="12" fill="white" font-family="Arial, sans-serif" opacity="0.8">
      surjoislive
    </text>
  </g>
  
  <!-- Telegram Badge -->
  <g filter="url(#badgeShadow)">
    <rect x="740" y="45" width="160" height="60" rx="8" fill="#0088cc"/>
    <text x="800" y="70" font-size="20" text-anchor="middle">✈️</text>
    <text x="820" y="75" font-size="16" font-weight="bold" fill="white" font-family="Arial, sans-serif">
      Telegram
    </text>
    <text x="820" y="95" font-size="12" fill="white" font-family="Arial, sans-serif" opacity="0.8">
      surjoislive
    </text>
  </g>
</svg>