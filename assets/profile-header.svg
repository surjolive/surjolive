<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00CCFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF99;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGradient)"/>
  
  <!-- Decorative elements -->
  <circle cx="50" cy="50" r="30" fill="#0099FF" opacity="0.2"/>
  <circle cx="750" cy="150" r="40" fill="#FF1493" opacity="0.2"/>
  
  <!-- Main branding text -->
  <text x="400" y="70" font-size="64" font-weight="bold" fill="#0099FF" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="3">
    SURJO LIVE
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="120" font-size="28" fill="#FFFFFF" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="2" opacity="0.9">
    Cloud Engineer | DevOps Expert | Community
  </text>
  
  <!-- Bottom accent line -->
  <line x1="150" y1="160" x2="650" y2="160" stroke="#FF1493" stroke-width="3" opacity="0.7"/>
  
  <!-- Social quick links -->
  <text x="200" y="185" font-size="14" fill="#0099FF" font-family="Arial" font-weight="bold">
    📺 YouTube  |  📸 Instagram  |  💬 Discord  |  🎵 TikTok
  </text>
</svg>