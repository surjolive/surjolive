<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="avatarShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="hatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A89023;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="skinTone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E8B899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A574;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="none"/>
  
  <!-- Top Goggles/Sunglasses on Hat -->
  <ellipse cx="85" cy="55" rx="25" ry="18" fill="none" stroke="#4A4A4A" stroke-width="3"/>
  <ellipse cx="215" cy="55" rx="25" ry="18" fill="none" stroke="#4A4A4A" stroke-width="3"/>
  <line x1="110" y1="55" x2="190" y2="55" stroke="#4A4A4A" stroke-width="3"/>
  <!-- Reflection on goggles -->
  <ellipse cx="80" cy="50" rx="10" ry="8" fill="#87CEEB" opacity="0.6"/>
  <ellipse cx="210" cy="50" rx="10" ry="8" fill="#87CEEB" opacity="0.6"/>
  
  <!-- Hat -->
  <ellipse cx="150" cy="70" rx="100" ry="35" fill="url(#hatGradient)" filter="url(#avatarShadow)"/>
  <path d="M 80 70 Q 80 20 150 15 Q 220 20 220 70" fill="url(#hatGradient)" stroke="#8B7500" stroke-width="2"/>
  <path d="M 50 75 L 250 75 L 240 85 L 60 85 Z" fill="#C9A961" stroke="#8B7500" stroke-width="1"/>
  
  <!-- Face/Head -->
  <circle cx="150" cy="180" r="65" fill="url(#skinTone)" stroke="#D4A574" stroke-width="2"/>
  
  <!-- Ears -->
  <ellipse cx="95" cy="160" rx="15" ry="30" fill="url(#skinTone)" stroke="#D4A574" stroke-width="1"/>
  <ellipse cx="205" cy="160" rx="15" ry="30" fill="url(#skinTone)" stroke="#D4A574" stroke-width="1"/>
  
  <!-- Mask (Black) -->
  <path d="M 100 160 L 140 150 L 160 150 L 200 160 L 195 210 L 105 210 Z" fill="#000000" rx="8"/>
  
  <!-- Mask Eye Symbols -->
  <!-- Left X -->
  <line x1="120" y1="175" x2="135" y2="190" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="135" y1="175" x2="120" y2="190" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Right Pi symbol -->
  <text x="165" y="190" font-size="28" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif" text-anchor="middle">π</text>
  
  <!-- Neck -->
  <rect x="125" y="235" width="50" height="25" fill="url(#skinTone)" stroke="#D4A574" stroke-width="1"/>
  
  <!-- Jersey/Shirt -->
  <path d="M 50 260 L 120 250 L 180 250 L 250 260 L 240 350 L 60 350 Z" 
        fill="#FFFFFF" stroke="#4A4A4A" stroke-width="2" filter="url(#avatarShadow)"/>
  
  <!-- Jersey Collar - Red/Green pattern -->
  <rect x="120" y="250" width="60" height="15" fill="none" stroke="#FF0000" stroke-width="2" rx="3"/>
  <rect x="115" y="250" width="70" height="8" fill="none" stroke="#00AA00" stroke-width="1" opacity="0.7"/>
  
  <!-- Jersey Details -->
  <circle cx="140" cy="300" r="8" fill="none" stroke="#0066FF" stroke-width="2"/>
  <text x="140" y="305" font-size="12" fill="#0066FF" font-family="Arial" text-anchor="middle" font-weight="bold">⊕</text>
  
  <!-- Signature on Jersey -->
  <path d="M 160 320 Q 170 315 180 320" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- SURJO LIVE Text Banner -->
  <g filter="url(#avatarShadow)">
    <rect x="60" y="260" width="180" height="35" rx="5" fill="none" stroke="#FF1493" stroke-width="2"/>
    <text x="150" y="280" font-size="24" font-weight="900" fill="#FF1493" font-family="Arial, sans-serif" text-anchor="middle" letter-spacing="2">
      SURJO LIVE
    </text>
  </g>
  
  <!-- Arms (subtle) -->
  <rect x="30" y="280" width="30" height="25" rx="10" fill="url(#skinTone)" stroke="#D4A574" stroke-width="1"/>
  <rect x="240" y="280" width="30" height="25" rx="10" fill="url(#skinTone)" stroke="#D4A574" stroke-width="1"/>
</svg>