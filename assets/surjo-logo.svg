<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0099FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00CCFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer circle border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#logoBg)" stroke-width="2" filter="url(#glow)"/>
  
  <!-- Inner circle background -->
  <circle cx="100" cy="100" r="90" fill="#0a0e27"/>
  
  <!-- Letter S shape with gradient -->
  <path d="M 70 60 Q 85 50 100 55 Q 115 60 110 75 Q 105 85 90 85 Q 75 85 80 100 Q 85 115 100 120 Q 115 125 120 140" 
        stroke="url(#logoBg)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Decorative live indicator dots -->
  <circle cx="140" cy="60" r="6" fill="#FF1493" opacity="0.8" filter="url(#glow)"/>
  <circle cx="150" cy="70" r="4" fill="#00CCFF" opacity="0.6" filter="url(#glow)"/>
  <circle cx="145" cy="85" r="3" fill="#0099FF" opacity="0.4" filter="url(#glow)"/>
</svg>